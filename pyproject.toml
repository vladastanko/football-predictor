[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpred"
version = "0.1.0"
description = "Probabilistic match outcome model for the top 10 European football leagues"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "lightgbm>=4.0",
  "requests>=2.31", "pyyaml>=6.0", "pyarrow>=14", "matplotlib>=3.7", "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fpred = "fpred.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
